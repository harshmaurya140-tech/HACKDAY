name: Validate Incognix
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:model
      - run: npm run build
      - run: npm run verify:model
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: incognix-development-build
          path: |
            dist/
            artifacts/
